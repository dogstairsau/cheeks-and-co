<script>
  /* Flag the document synchronously so reveal targets never flash in
     before GSAP takes over. Motion-averse visitors keep static content. */
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('js-anim');
    // Safety net: if the motion module never boots (blocked, failed parse,
    // offline chunk), drop the pre-hide so the page is still fully readable.
    setTimeout(function () {
      if (!document.documentElement.hasAttribute('data-motion-ready')) {
        document.documentElement.classList.remove('js-anim');
      }
    }, 2500);
  }
</script>
